version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
      time: "21:00"
      timezone: "Asia/Shanghai"
    target-branch: master
    open-pull-requests-limit: 1
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "21:15"
      timezone: "Asia/Shanghai"
    target-branch: master
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
